<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Five Nights at Sea World</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
    <style>
        .start-overlay {
            /* Updated to match your exact file name with the capital S */
            background-image: linear-gradient(90deg, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.8) 39%, rgba(0,0,0,0.18) 100%), url('Seaworld-entrance.jpg') !important;
            background-position: center right !important;
            background-size: cover !important;
            background-repeat: no-repeat !important;
        }
    </style>
</head>
<body>
<main class="game-shell" aria-label="Five Nights at Sea World browser game">
    <section class="game-frame" id="gameFrame">


        <!-- OFFICE VIEW -->
        <div class="office-view" id="officeView">
          <img class="office-bg" src="fna willem security room.png" alt="">
          <div class="left-hall-warning" id="hallWarning"></div>
          <img class="office-threat" id="officeThreat" src="willem fnaf1.png" alt="">
          <img class="office-threat vent-office-threat" id="ventOfficeThreat" src="willem fnaf1.png" alt="">
          <div class="screen-noise"></div>
          <div class="vignette"></div>

          <!-- White exit arrow — left edge of the office -->
          <button class="exit-office-arrow" id="exitArrow" type="button" aria-label="Exit security office to perform tasks">
            <span class="exit-arrow-icon">▶</span>
            <span class="exit-arrow-label">EXIT</span>
          </button>
        </div>

        <!-- HUD -->
        <aside class="hud" aria-label="Night status">
          <div>
            <span class="hud-label">NIGHT</span>
            <strong id="nightLabel">1</strong>
          </div>
          <div>
            <span class="hud-label">TIME</span>
            <strong id="timeLabel">12 AM</strong>
          </div>
          <div>
            <span class="hud-label">SIGNAL</span>
            <strong id="signalLabel">100%</strong>
          </div>
          <div>
            <span class="hud-label">VENT</span>
            <strong id="ventLabel">100%</strong>
          </div>
        </aside>

        <div class="alert-bar" id="alertBar">System ready</div>

        <!-- Corner task tracker (required task popup + in-progress tracker) -->
        <div class="task-popup is-hidden" id="taskPopup" aria-live="assertive"></div>

        <!-- Camera toggle button -->
        <button class="tablet-tab" id="tabletToggle" type="button" aria-label="Open security cameras">
          CAMERAS
        </button>

        <!-- Camera panel -->
        <section class="camera-panel" id="cameraPanel" aria-label="Security cameras">
          <div class="camera-feed">
            <img class="camera-image" id="cameraImage" src="five nights at willem backround image 1.jpg" alt="">
            <img class="camera-threat sprite-threat" id="cameraThreat" src="willem-cam-1.png" alt="">
            <img class="camera-threat sprite-threat vent-threat" id="ventThreat" src="willem-cam-1.png" alt="">
            <div class="camera-static" id="cameraStatic"></div>
            <div class="feed-title">
              <span id="cameraName">CAM 01 - Docks</span>
              <span id="cameraStatus">ONLINE</span>
            </div>
            <div class="feed-meta" id="feedMeta">No movement</div>
          </div>

          <div class="camera-side">
            <div class="map" id="cameraMap" aria-label="Camera map"></div>
            <div class="system-panel">
              <button id="audioButton" type="button">Play Audio</button>
              <button id="ventButton" type="button">Close Vent</button>
              <button id="cameraModeButton" type="button">Vent Cams</button>
              <button id="rebootButton" type="button">Reboot All</button>
            </div>
            <div class="system-readouts">
              <p><span>Audio</span><meter id="audioMeter" min="0" max="100" value="100"></meter></p>
              <p><span>Video</span><meter id="videoMeter" min="0" max="100" value="100"></meter></p>
              <p><span>Airflow</span><meter id="airMeter" min="0" max="100" value="100"></meter></p>
            </div>
          </div>
        </section>

        <!-- Task panel (corridor view, task animations, etc.) -->
        <div id="taskPanel"></div>

        <!-- START OVERLAY -->
        <section class="overlay start-overlay" id="startOverlay" aria-label="Start game">
          <div class="title-block">
            <div class="title-mark" aria-hidden="true">
              <span>F</span><span>N</span><span>S</span><span>W</span>
            </div>
            <h1>Five Nights at Sea World</h1>
            <input id="nightSelect" type="hidden" value="1">
            <input id="threatSelect" type="hidden" value="normal">
            <div class="menu-actions">
              <button id="startButton" type="button">New Game</button>
              <button id="continueButton" type="button">Continue</button>
            </div>
            <p class="progress-note" id="progressNote">No saved shift</p>
          </div>
        </section>

        <!-- JUMPSCARE OVERLAY -->
        <section class="jumpscare-overlay is-hidden" id="jumpscareOverlay" aria-hidden="true">
          <img class="jumpscare-sprite" id="jumpscareSprite" src="willem-jump-1.png" alt="">
        </section>

        <!-- END OVERLAY -->
        <section class="overlay end-overlay is-hidden" id="endOverlay" aria-live="assertive">
          <img id="endImage" src="fna willem security room.png" alt="">
          <div class="end-copy">
            <h2 id="endTitle">Shift complete</h2>
            <p id="endText">You made it to 6 AM.</p>
            <div class="end-actions">
              <button id="restartButton" type="button">Replay Night</button>
              <button id="nextButton" class="is-hidden" type="button">Next Night</button>
              <button id="menuButton" type="button">Menu</button>
            </div>
          </div>
        </section>

      </section>
    </main>
  </body>
</html>
